apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devopshere
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thesakshidiggikar/Cloud-Native-Application-Deployment-Platform.git
    targetRevision: main
    path: deploy/helm/devopshere
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: devopshere
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
