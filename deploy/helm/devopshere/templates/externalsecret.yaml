{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.runtimeSecretName }}
  labels:
    {{- include "devopshere.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ required "externalSecret.secretStoreName is required" .Values.externalSecret.secretStoreName }}
    kind: SecretStore
  target:
    name: {{ .Values.runtimeSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: APP_DATABASE_URL
      remoteRef:
        key: {{ required "externalSecret.remoteKey is required" .Values.externalSecret.remoteKey | quote }}
        property: APP_DATABASE_URL
    - secretKey: APP_REDIS_URL
      remoteRef:
        key: {{ required "externalSecret.remoteKey is required" .Values.externalSecret.remoteKey | quote }}
        property: APP_REDIS_URL
{{- end }}
